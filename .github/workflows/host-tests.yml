name: Host tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        run: brew install uv
      - name: Prepare pinned dependencies
        run: |
          uv sync --locked
          uv run --locked python tools/bootstrap.py --font
      - name: Public source boundary
        run: uv run --locked python tools/publication_check.py
      - name: Host tests (no skipped prerequisites)
        run: uv run --locked python tools/test.py
